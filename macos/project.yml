name: STGMac
options:
  bundleIdPrefix: com.timbertrail.screentimeguardian
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: DA6DVPSL36
targets:
  STGCore:
    type: framework
    platform: macOS
    sources:
      - path: ../apple/STGCore/Sources/STGCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timbertrail.screentimeguardian.macos.core
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: AuthenticationServices.framework
      - sdk: Security.framework
  STGMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/STGMac
      - path: assets/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timbertrail.screentimeguardian.macos
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: STGMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: STGCore
      - sdk: AppKit.framework
      - sdk: CoreAudio.framework
      - sdk: AuthenticationServices.framework
      - sdk: IOKit.framework
      - sdk: Security.framework
      - sdk: UniformTypeIdentifiers.framework
schemes:
  STGMac:
    build:
      targets:
        STGMac: all
