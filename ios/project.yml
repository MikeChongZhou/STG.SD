name: STG
options:
  bundleIdPrefix: com.timbertrail.screentimeguardian
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: DA6DVPSL36
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  STGCore:
    type: framework
    platform: iOS
    sources:
      - path: ../apple/STGCore/Sources/STGCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timbertrail.screentimeguardian.ios.core
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.1.8"
        CURRENT_PROJECT_VERSION: "23"
    dependencies:
      - sdk: libsqlite3.tbd
  STG:
    type: application
    platform: iOS
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.timbertrail.screentimeguardian.ios
      configs:
        Debug:
          ENABLE_DEBUG_DYLIB: NO
    sources:
      - path: STG/App
      - path: STG/Shared
    dependencies:
      - target: STGCore
      - target: STGDeviceActivityMonitor
      - sdk: FamilyControls.framework
      - sdk: DeviceActivity.framework
      - sdk: BackgroundTasks.framework
    entitlements:
      path: STG/App/STG.entitlements
      properties:
        com.apple.developer.device-information.user-assigned-device-name: true
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.timbertrail.screentimeguardian
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.timbertrail.screentimeguardian
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.timbertrail.screentimeguardian
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.timbertrail.screentimeguardian
    info:
      path: STG/App/Info.plist
      properties:
        CFBundleDisplayName: Screen Time Guardian
        CFBundleShortVersionString: "1.1.8"
        CFBundleVersion: "23"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        STGOneDriveClientID: "a4ff927c-e45a-413e-b5c3-45b026719171"
        STGKeychainAccessGroup: "$(AppIdentifierPrefix)group.com.timbertrail.screentimeguardian"
        STGGoogleClientID: "552360735383-alblvd6inepkvg6cni453j1t6pl6gf0g.apps.googleusercontent.com"
        NSUbiquitousContainers:
          iCloud.com.timbertrail.screentimeguardian:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Screen Time Guardian
            NSUbiquitousContainerSupportedFolderLevels: Any
        CFBundleURLTypes:
          - CFBundleURLName: STG Google OAuth
            CFBundleURLSchemes:
              - com.googleusercontent.apps.552360735383-alblvd6inepkvg6cni453j1t6pl6gf0g
          - CFBundleURLName: STG Microsoft OAuth
            CFBundleURLSchemes:
              - msauth.com.timbertrail.screentimeguardian.ios
        BGTaskSchedulerPermittedIdentifiers:
          - com.timbertrail.screentimeguardian.ios.refresh
        UIBackgroundModes:
          - fetch
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  STGDeviceActivityMonitor:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timbertrail.screentimeguardian.ios.monitor
      configs:
        Debug:
          ENABLE_DEBUG_DYLIB: NO
    sources:
      - path: STG/Monitor
      - path: STG/Shared
    dependencies:
      - target: STGCore
      - sdk: DeviceActivity.framework
      - sdk: FamilyControls.framework
      - sdk: UserNotifications.framework
    entitlements:
      path: STG/Monitor/STGDeviceActivityMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.timbertrail.screentimeguardian
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.timbertrail.screentimeguardian
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.timbertrail.screentimeguardian
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.timbertrail.screentimeguardian
    info:
      path: STG/Monitor/Info.plist
      properties:
        CFBundleDisplayName: STG Monitor
        CFBundleShortVersionString: "1.1.8"
        CFBundleVersion: "23"
        STGOneDriveClientID: "a4ff927c-e45a-413e-b5c3-45b026719171"
        STGKeychainAccessGroup: "$(AppIdentifierPrefix)group.com.timbertrail.screentimeguardian"
        STGGoogleClientID: "552360735383-alblvd6inepkvg6cni453j1t6pl6gf0g.apps.googleusercontent.com"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
  STGCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../apple/STGCore/Tests/STGCoreTests
    dependencies:
      - target: STGCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.timbertrail.screentimeguardian.ios.coretests
schemes:
  STG:
    build:
      targets:
        STG: all
        STGDeviceActivityMonitor: all
  STGCoreTests:
    build:
      targets:
        STGCoreTests: all
    test:
      targets:
        - STGCoreTests
